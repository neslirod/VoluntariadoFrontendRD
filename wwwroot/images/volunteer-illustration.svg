<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dc3545;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d6efd;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#198754;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d6efd;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="#f8f9fa" rx="20"/>
  
  <!-- People holding hands (community) -->
  <g transform="translate(50, 80)">
    <!-- Person 1 -->
    <circle cx="30" cy="40" r="25" fill="url(#grad1)"/>
    <rect x="25" y="65" width="10" height="40" fill="url(#grad1)" rx="5"/>
    <line x1="20" y1="75" x2="10" y2="85" stroke="url(#grad1)" stroke-width="3"/>
    <line x1="40" y1="75" x2="50" y2="85" stroke="url(#grad1)" stroke-width="3"/>
    
    <!-- Person 2 -->
    <circle cx="90" cy="40" r="25" fill="url(#grad2)"/>
    <rect x="85" y="65" width="10" height="40" fill="url(#grad2)" rx="5"/>
    <line x1="80" y1="75" x2="70" y2="85" stroke="url(#grad2)" stroke-width="3"/>
    <line x1="100" y1="75" x2="110" y2="85" stroke="url(#grad2)" stroke-width="3"/>
    
    <!-- Person 3 -->
    <circle cx="150" cy="40" r="25" fill="url(#grad1)"/>
    <rect x="145" y="65" width="10" height="40" fill="url(#grad1)" rx="5"/>
    <line x1="140" y1="75" x2="130" y2="85" stroke="url(#grad1)" stroke-width="3"/>
    <line x1="160" y1="75" x2="170" y2="85" stroke="url(#grad1)" stroke-width="3"/>
    
    <!-- Connecting lines (hands) -->
    <line x1="55" y1="40" x2="65" y2="40" stroke="#6c757d" stroke-width="4" stroke-linecap="round"/>
    <line x1="115" y1="40" x2="125" y2="40" stroke="#6c757d" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Heart symbol -->
  <g transform="translate(200, 60)">
    <path d="M0,0 C-15,-15 -30,-5 -30,10 C-30,25 -15,35 0,45 C15,35 30,25 30,10 C30,-5 15,-15 0,0 Z" fill="#dc3545"/>
  </g>
  
  <!-- Abstract shapes representing growth/impact -->
  <g transform="translate(300, 100)">
    <circle cx="0" cy="0" r="20" fill="url(#grad2)" opacity="0.7"/>
    <circle cx="30" cy="20" r="15" fill="url(#grad1)" opacity="0.5"/>
    <circle cx="50" cy="0" r="10" fill="url(#grad2)" opacity="0.3"/>
  </g>
  
  <!-- Text elements -->
  <text x="200" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#212529">Comunidad</text>
  <text x="200" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#6c757d">Conectando vidas</text>
  
  <!-- Decorative elements -->
  <g transform="translate(50, 250)">
    <circle cx="0" cy="0" r="3" fill="url(#grad1)"/>
    <circle cx="20" cy="0" r="3" fill="url(#grad2)"/>
    <circle cx="40" cy="0" r="3" fill="url(#grad1)"/>
    <circle cx="60" cy="0" r="3" fill="url(#grad2)"/>
    <circle cx="80" cy="0" r="3" fill="url(#grad1)"/>
  </g>
  
  <g transform="translate(250, 250)">
    <circle cx="0" cy="0" r="3" fill="url(#grad2)"/>
    <circle cx="20" cy="0" r="3" fill="url(#grad1)"/>
    <circle cx="40" cy="0" r="3" fill="url(#grad2)"/>
    <circle cx="60" cy="0" r="3" fill="url(#grad1)"/>
    <circle cx="80" cy="0" r="3" fill="url(#grad2)"/>
  </g>
</svg> 
